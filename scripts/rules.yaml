# =============================================================================
# 微信 + 支付宝账单自动化：清洗规则 + 分类规则
# 供 自动化方案/bills.py 读取。全部 UTF-8。
#
# 分类执行顺序（bills.py 固定实现）：
#   1) 分类字典 special_rules（房间充值 ÷4；群收款收支都记团建；电费AA代收 → 删除）
#   2) 分类映射.csv（先「交易对方」精确匹配，再按商户名包含匹配，长者优先）
#   3) 本文件 classify 列表，按顺序逐条匹配，第一条命中即用
#   4) 都没命中 -> 兜底（示例口径）：支出 → 其他，收入 → 其他收入
#      「待确认」sheet 只作为字典外标签/异常的安全网，正常应为 0 行
#
# 标签必须收录在 分类字典.yaml（支出 22 类 + 收入 4 类）里；bills.py 会强校验，
# 字典外标签会被拦下、打印警告并进「待确认」。
# 只有 收/支 为「支出」「收入」的行才需要类型；「不计收支」和 "/" 一律留空。
# =============================================================================
version: 1

clean:
  # 金额 == 0 的行删除
  drop_zero_amount: true

  # 退款行：退款收入行删除，原支出行按「原支出 − 退款金额」净额入账（不整单删除）
  drop_refund:
    enabled: true
    sources: [微信支付, 支付宝]
    type_contains: ["-退款"]        # 例：微信「双喜铁板烧-退款」
    status_contains: [已退款, 退款成功]  # 例：微信「已退款¥39.00」「已退款(¥39.00)」

  # 交易关闭行删除（只删「支出/收入」方向；不计收支/中性保留、类型留空）
  drop_closed:
    enabled: true
    status_values: [交易关闭]
    directions: [支出, 收入]
    keep_neutral: true

  neutral_directions: ["不计收支", "/"]
  neutral_keep_type_blank: true
  dedupe: true

# 收入类标签只允许用在「收入」行上
income_only_categories: [生活费, 还钱, 补贴奖励, 其他收入]

# ---------------------------------------------------------------------------
# 分类关键词规则（顺序敏感：越具体的越靠前）
# match 支持：
#   字段名: 值 / [值...]             完全等于（或属于列表）
#   字段名_contains: [子串...]       包含任一子串
#   字段名_not_contains: [子串...]   不包含任何子串
#   金额_min / 金额_max              金额区间（含边界）
# ---------------------------------------------------------------------------
classify:
  # ---------- 电费 / 医疗 / 校园设备 ----------
  - name: 电费
    note: 中国地质大学「房间充值」= 宿舍电费；实际金额由分类字典 special_rules 按 ÷4 折算
    match: {收/支: 支出, 商品_contains: [房间充值]}

  # ---------- 学费 / 医保（中国地质大学(武汉)「在线缴费」，先按金额区分） ----------
  - name: 学费
    note: 在线缴费/学费/住宿费等大额缴费（金额 ≥ 1000），必须先于医保规则判定
    match:
      收/支: 支出
      商品_contains: [在线缴费, 学费, 住宿费]
      金额_min: 1000

  - name: 医保
    note: 在线缴费/医保/医疗保险（金额 < 1000，如 2026-09-10 那笔 ¥400 医保）
    match:
      收/支: 支出
      商品_contains: [在线缴费, 医保, 医疗保险]
      金额_max: 999.99

  - name: 医疗
    match: {收/支: 支出, 商品_contains: [门诊, 挂号, 处方, 药房, 买药]}

  - name: 医疗
    match: {收/支: 支出, 交易对方_contains: [医院, 卫生院, 诊所, 药店]}

  - name: 洗衣机
    match: {收/支: 支出, 交易对方_contains: [U净, 洗烘, 洗衣机]}

  - name: 热水
    match: {收/支: 支出, 交易对方_contains: [慧生活798, 热水]}

  - name: 饮水机
    match: {收/支: 支出, 交易对方_contains: [趣智校园, 饮水机], 商品_not_contains: [洗澡, 淋浴]}

  # ---------- 奶茶咖啡 ----------
  - name: 奶茶咖啡
    match:
      收/支: 支出
      交易对方_contains: [蜜雪冰城, 益禾堂, 茶百道, 茉莉奶白, CHICHA, 古茗, 沪上阿姨, 霸王茶姬, 喜茶, 奈雪, 茶颜悦色, 瑞幸, 库迪]

  # ---------- 交通（打车 / 共享单车 / 火车 / 充电桩） ----------
  - name: 交通
    match:
      收/支: 支出
      交易对方_contains: [哈啰, 哈喽, 滴滴, 百度用车, 快车, T3出行, 首汽, 曹操出行, 高德打车, 12306, 中铁网络, 火车票, 高铁, 航空, 街电, 充电桩]

  - name: 交通
    match:
      收/支: 支出
      商品_contains: [打车, 快车, 用车费用, 先骑后付, 先充后付, 骑行卡, 单车骑行, 充电桩]

  # ---------- 外卖（必须在网购前） ----------
  - name: 外卖
    match: {收/支: 支出, 商品_contains: [外卖订单, 点餐订单, 美团订单, 美团微信小程序, 饿了么]}

  - name: 外卖
    match: {收/支: 支出, 交易对方_contains: [淘宝闪购, 肯德基, 塔斯汀, 麦当劳, 华莱士, 德克士]}

  # ---------- 学习（考试报名费 / 打印复印 / 线下教材；线上买的学习资料归网购） ----------
  - name: 学习
    match: {收/支: 支出, 交易对方_contains: [打印, 图文, 考试院, 教育部教育考试院, 赛氪]}

  - name: 学习
    match: {收/支: 支出, 交易类型: 商户消费, 商品_contains: [教材, 课本]}

  # ---------- 娱乐（视频/音乐会员、游戏、AI 订阅） ----------
  - name: 娱乐
    match:
      收/支: 支出
      交易对方_contains: [腾讯视频, bilibili, 哔哩哔哩, 百度网盘, Valve, Steam, 小黑盒, 爱奇艺, 优酷, 网易云, 芒果TV, QQ音乐, 深度求索, DeepSeek]

  - name: 娱乐
    match: {收/支: 支出, 商品_contains: [绿钻, QQ音乐, 视频会员, API]}

  # ---------- 生活服务（快递寄件 / 共享充电宝 / 租借） ----------
  - name: 生活服务
    match: {收/支: 支出, 交易对方_contains: [物流, 快递, 驿站, 企鹅共享]}

  - name: 生活服务
    match: {收/支: 支出, 商品_contains: [寄件, 快递费, 充电宝, 租借, 企鹅共享]}

  # ---------- 健身 ----------
  - name: 健身
    match: {收/支: 支出, 交易对方_contains: [健身, 康力体育]}

  # ---------- 水果 / 线下购物 ----------
  - name: 水果
    match: {收/支: 支出, 交易对方_contains: [水果店, 水果]}

  # 线下超市、便利店、零食店、日用品、个体户/小商户门店（水果店除外，饭店归餐饮）
  - name: 线下购物
    note: 线下超市/便利店/零食店/个体户门店统一归线下购物（水果店、饭店除外）
    match:
      收/支: 支出
      交易对方_contains: [超市, 便利店, 零食, 好想来, 711, 7-ELEVEn, 新佳宜, 可口可乐, 农夫山泉]

  - name: 线下购物
    match: {收/支: 支出, 商品_contains: [先购后付]}

  - name: 线下购物
    match:
      收/支: 支出
      交易对方_contains: [个体户, 商户_, 商店, 百货, 杂货]

  # ---------- 食堂（严格：只有中国地质大学校园卡消费） ----------
  - name: 食堂
    note: 仅中国地质大学校园卡消费算食堂；「房间充值」在上方已判为电费
    match:
      收/支: 支出
      交易对方_contains: [中国地质大学]
      商品_contains: [中国地质大学]
      商品_not_contains: [缴费, 房间充值, 在线缴费]

  # ---------- 餐饮（校内外饭店/小吃，不算食堂） ----------
  - name: 餐饮
    note: 食堂只留给中国地质大学校园卡，其他饭店/小吃统一归餐饮
    match:
      收/支: 支出
      交易对方_contains: [沙县小吃, 快餐, 餐饮, 早餐, 锅盔, 鍋盔, 一米噜, 茶港, 湯师傅, 汤师傅, 面馆, 米线, 饺子馆, 麻辣烫, 茶餐厅, 梦之源]

  # ---------- 团建（群收款收支两个方向都由 分类字典.yaml special_rules 处理：都记团建） ----------
  - name: 团建
    note: 「桌游」（MT-陨石桌游 55 元）与 9-25 中秋聚餐同一晚，暂按团建；若属娱乐请改
    match: {收/支: 支出, 商品_contains: [桌游]}

  # ---------- 网购（兜底类，放在最后） ----------
  - name: 网购
    note: 线上购买的学习资料（备考/真题/教材/试卷）归网购
    match:
      收/支: 支出
      商品_contains: [备考, 真题, 试卷, 教材, 课本, 词汇, 单词, 六级, 四级, 考研, 教辅, 辅导书, 题库]

  - name: 网购
    note: 日用品/抽纸等线上购买（湖北匠作工坊那笔抽纸）
    match: {收/支: 支出, 商品_contains: [抽纸, 纸巾]}

  - name: 网购
    match:
      收/支: 支出
      交易对方_contains: [拼多多, 淘宝, 天猫, 京东, 小红书, 闲鱼, 唯品会, "**店", "**司"]

  - name: 网购
    note: 支付宝担保交易 = 淘宝/天猫下单（外卖、餐饮已在上面单独命中）
    match: {收/支: 支出, 交易类型: 支付宝担保交易}

  # ---------- 生活费（家长转入） ----------
  - name: 补贴奖励
    note: 平台返现/红包/签到提现/评价奖励等小额补贴（淘宝返现）
    match: {收/支: 收入, 商品_contains: [签到提现, 评价奖励, 返现]}

  - name: 生活费
    match: {收/支: 收入, 交易对方_contains: [妈妈, 爸爸, 美玉]}
