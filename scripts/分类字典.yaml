# =============================================================================
# 固定资产分类字典（示例版本）—— 按自己的习惯修改
#
# 规则：账单里的「类型」只允许出现本文件列出的标签；出现字典外的标签一律报错/进待确认。
# 支出 22 类 + 收入 4 类；「不计收支」和 "/" 不分类（类型留空）。
# aliases 用于把历史月份的旧标签统一到新标签（跨月对比用）。
# =============================================================================
version: 3

expense:
  食堂:
    desc: 校园卡消费（食堂/校内餐厅刷卡，商品名=学校名）
  餐饮:
    desc: 校内外饭店、小吃、快餐、面馆、早餐、烧烤（非外卖）
  外卖:
    desc: 外卖平台订单（美团/饿了么/淘宝闪购等，商品含"外卖订单/点餐订单"）
  奶茶咖啡:
    desc: 奶茶、咖啡、饮品店（蜜雪冰城/益禾堂/茶百道/茉莉奶白/瑞幸等）
  水果:
    desc: 水果店
  线下购物:
    desc: 线下超市/便利店/零食店/日用品/服装/数码/文具/自动售货机（水果店、饭店除外）
  网购:
    desc: 线上购物（淘宝/天猫/京东/拼多多/小红书/闲鱼等），含线上买的学习资料、虚拟商品
  电费:
    desc: 宿舍电费（房间充值，只记自己那一份：充值金额 ÷ 合住人数）
  热水:
    desc: 洗澡热水/水表/淋浴充值（慧生活798 等）
  洗衣机:
    desc: 洗衣设备（U净洗烘等）
  饮水机:
    desc: 校园饮水机充值（趣智校园等）
  话费:
    desc: 手机话费
  交通:
    desc: 打车/共享单车/火车/公交/充电桩
  学习:
    desc: 考试报名费、打印复印、线下教材/课本
  娱乐:
    desc: 视频/音乐会员、游戏、电影、桌游、AI 订阅
  医疗:
    desc: 医院、药房、门诊
  学费:
    desc: 学费/住宿费/大额在线缴费（金额 ≥ 1000）
  医保:
    desc: 医保/医疗保险缴费（「在线缴费」且金额 < 1000，如医保 ¥400）
  健身:
    desc: 健身房、体育场馆
  生活服务:
    desc: 快递寄件、共享充电宝、理发等
  团建:
    desc: 团队/集体活动（群收款支出、聚餐 AA、集体活动）
  其他:
    desc: 无法归类的兜底（应尽量少用）

income:
  生活费:
    desc: 父母给的生活费
  还钱:
    desc: 朋友还钱
  补贴奖励:
    desc: 奖学金/补助/平台返现/红包
  其他收入:
    desc: 出书、卖闲置等

neutral:
  - 不计收支
  - /

# 允许双向使用（既可作为支出类型，也可作为收入类型）的标签
cross_direction:
  - 团建

# 旧标签 -> 新标签（历史 3/4-5/6/7-8 月统一口径用）
aliases:
  奶茶: 奶茶咖啡
  出行: 交通
  哈喽单车: 交通
  打车: 交通
  健身房: 健身
  医院: 医疗
  校医院: 医疗
  教材: 学习
  课本: 学习
  打印: 学习
  考试费: 学习
  购物: 线下购物
  零食: 线下购物
  买自行车: 线下购物
  QQ音乐: 娱乐
  AI服务: 娱乐
  电费AA: 电费
  SSL分红: 补贴奖励
  新加坡姚补: 补贴奖励
  出书: 其他收入
  天协还款: 还钱
  团费: 团建
  出差已报销: 其他收入

# 特殊记账口径（写进规则，代码按此执行）
special_rules:
  # 房间充值：舍友把份额转给用户、用户统一充值 → 只记自己那一份
  房间充值:
    类型: 电费
    金额除数: 4                 # 历史两次都是 100 -> 25，即 4 人合住
    说明: 充值金额 ÷ 4 = 自己那份；舍友转来的份额不记账
  # 舍友转来的电费份额：收入 + 转账 + 对方在名单内 → 删除（不记账）
  电费AA收款:
    操作: 删除
    方向: 收入
    交易类型: 转账
    对方名单: []   # 填你自己的室友/合租人名字，例如 [室友A, 室友B]
    说明: 统一充值时舍友转回的份额，按示例口径不记账
  # 群收款：支出、收入都记「团建」（示例口径，可自行调整）
  群收款:
    支出: 团建
    收入: 团建
